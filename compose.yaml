services:
  db:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_DB: foodbridge
      POSTGRES_USER: foodbridge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-foodbridge-dev}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foodbridge -d foodbridge"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres-data:
